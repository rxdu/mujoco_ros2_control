name: CI
on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - ros2

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code from current branch
      uses: actions/checkout@v5
    - name: Setup ROS
      uses: ros-tooling/setup-ros@v0.7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo rosdep update --rosdistro humble
        sudo rosdep install --from-paths . --ignore-src -y -t test --rosdistro humble
    - name: Run pre-commit
      run: |
        pip3 install pre-commit
        source /opt/ros/humble/setup.bash
        pre-commit run --all-files

  build_and_test:
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            os: ubuntu-22.04
          - ros_distro: jazzy
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code into workspace
      uses: actions/checkout@v5
      with:
        path: src/mujoco_ros2_control

    - name: Setup ROS ${{ matrix.ros_distro }}
      uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: ${{ matrix.ros_distro }}

    - name: Import sibling source dependencies
      run: |
        sudo apt-get update
        # libglfw3-dev / libtinyxml2-dev provide the CMake configs that
        # mujoco_sim_ros2's find_package(glfw3)/find_package(tinyxml2) need.
        sudo apt-get install -y python3-vcstool libglfw3-dev libtinyxml2-dev
        pip3 install xacro
        vcs import src < src/mujoco_ros2_control/mujoco_ros2_control.repos

    - name: Install ROS dependencies
      run: |
        sudo rosdep update --rosdistro ${{ matrix.ros_distro }}
        # mujoco is built from source (see .repos) and glfw3 comes from the
        # libglfw3-dev apt package above; neither is a resolvable rosdep key.
        sudo rosdep install --from-paths src --ignore-src -y \
          --rosdistro ${{ matrix.ros_distro }} --skip-keys "mujoco glfw3"

    - name: Build
      run: |
        source /opt/ros/${{ matrix.ros_distro }}/setup.bash
        # MUJOCO_BUILD_TESTS=OFF keeps the mujoco source build lean (skips
        # fetching googletest/benchmark); it only affects the mujoco package.
        colcon build --cmake-args \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DMUJOCO_BUILD_TESTS=OFF

    - name: Test
      run: |
        source /opt/ros/${{ matrix.ros_distro }}/setup.bash
        source install/setup.bash
        colcon test --packages-select mujoco_ros2_control mujoco_ros2_control_demos
        colcon test-result --verbose
